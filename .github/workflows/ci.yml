name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
  REMOTION_SKIP_BROWSER_DOWNLOAD: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate registry + catalog
        run: node cli/gen-registry.mjs

      - name: Generate props schemas
        run: node cli/gen-schemas.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build library
        run: npm run build:lib

      - name: Install site
        working-directory: site
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build site
        working-directory: site
        run: npm run build
